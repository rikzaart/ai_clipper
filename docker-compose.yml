version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_engine
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n

  ai_clipper:
    build: .
    container_name: ai_clipper_agent
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount folder data lokal agar output video persisten
      - ./raw:/app/raw
      - ./temp:/app/temp
      - ./finished:/app/finished
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
    depends_on:
      - n8n

volumes:
  n8n_data: